                          </div>
                          <div className="p-2.5 rounded-xl bg-slate-900 border border-slate-800">
                            <span className="text-slate-400 text-[9px] uppercase block">CONFIDENCE</span>
                            <span className="font-arcade text-[10px] text-cyber-green">{aiAnalysis.confidenceScore}%</span>
                          </div>
                          <div className="p-2.5 rounded-xl bg-slate-900 border border-slate-800">
                            <span className="text-slate-400 text-[9px] uppercase block">REPLY NEEDED</span>
                            <span className={`font-arcade text-[10px] ${aiAnalysis.requiresReply ? 'text-cyber-yellow' : 'text-slate-400'}`}>
                              {aiAnalysis.requiresReply ? 'YES' : 'NO'}
                            </span>
                          </div>
                        </div>

                        {/* Tactical Summary */}
                        <div className="p-3 bg-slate-900/90 rounded-xl border border-slate-800 mb-3 text-xs">
                          <span className="text-[10px] font-mono text-cyber-blue uppercase block mb-0.5">TACTICAL BRIEFING</span>
                          <p className="text-slate-200 font-sans leading-relaxed">{aiAnalysis.summary}</p>
                        </div>

                        {/* Recommendation Box */}
                        <div className="p-3.5 rounded-xl bg-purple-950/40 border border-cyber-purple/60 mb-5 text-xs">
                          <div className="flex items-center justify-between mb-1">
                            <span className="text-[10px] font-mono text-cyber-yellow uppercase">RECOMMENDED ACTION:</span>
                            <span className="font-arcade text-[11px] text-white">{aiAnalysis.recommendedAction.toUpperCase()}</span>
                          </div>
                          <p className="text-slate-300 font-sans leading-relaxed">{aiAnalysis.reason}</p>
                          {aiAnalysis.suggestedReply && (
                            <div className="mt-2 pt-2 border-t border-white/10 text-[11px] text-cyber-green font-mono">
                              Draft Reply: "{aiAnalysis.suggestedReply}"
                            </div>
                          )}
                        </div>

                        {/* Action Buttons: Accept / Reject */}
                        <div className="flex flex-col sm:flex-row gap-2.5">
                          <button
                            onClick={() => {
                              sound.playSpecialBeam();
                              acceptAiRecommendation(aiAnalysis.recommendedAction, aiAnalysis.category);
                            }}
                            className="flex-1 py-3 px-4 rounded-xl font-arcade text-xs text-black bg-gradient-to-r from-cyber-purple via-cyber-pink to-cyber-blue shadow-neon-purple active:scale-95 transition-all"
                          >
                            ACCEPT RECOMMENDATION (+250 XP)
                          </button>
                          <button
                            onClick={() => setShowAiModal(false)}
                            className="py-3 px-5 rounded-xl font-mono text-xs text-slate-400 bg-slate-900 border border-slate-800 hover:text-white"
                          >
                            Reject & Pick Manually
                          </button>
                        </div>

                        {aiAnalysis.source === 'fallback' && (
                          <p className="text-[10px] font-mono text-slate-500 text-center mt-2.5">
                            Tip: Add your Gemini API key in <code className="text-slate-400">.env</code> to activate live Gemini 1.5 Flash analysis!
                          </p>
                        )}
                      </div>
                    ) : null}
                  </div>
                </div>
              )}

              {/* SPECIAL ATTACK BATCH MODAL */}
              {showSpecialModal && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
                  <div className="relative w-full max-w-xl rounded-2xl bg-[#0c1222] border-2 border-cyber-green p-6 text-white shadow-[0_0_30px_rgba(0,255,102,0.3)]">
                    <button onClick={() => setShowSpecialModal(false)} className="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>
                    <div className="flex items-center gap-3 mb-4">
                      <div className="w-10 h-10 rounded-xl bg-cyber-green/20 border border-cyber-green flex items-center justify-center text-cyber-green text-xl">💥</div>
                      <div>
                        <h3 className="font-arcade text-sm text-white">HADOKEN INBOX CLEANSE</h3>
                        <p className="text-xs font-mono text-cyber-green">Multi-Email Batch Sweeper</p>
                      </div>
                    </div>
                    <p className="text-xs text-slate-300 font-sans mb-4">
                      AI Scan identified <strong>{batchEmails.length} matching emails</strong> ready for simultaneous annihilation!
                    </p>
                    <div className="space-y-2 mb-5 max-h-48 overflow-y-auto">
                      {batchEmails.map((em, idx) => (
                        <div key={idx} className="p-3 rounded-xl bg-slate-950 border border-slate-800 flex items-center justify-between text-xs">
                          <div className="truncate pr-2">
                            <span className="font-semibold text-white block truncate">{em.subject}</span>
                            <span className="text-[10px] text-slate-400 font-mono">{em.sender}</span>
                          </div>
                          <span className="px-2 py-0.5 rounded text-[9px] font-mono bg-slate-900 text-cyber-green border border-cyber-green/30 uppercase">{em.category}</span>
                        </div>
                      ))}
                    </div>
                    <div className="flex gap-3">
                      <button onClick={executeSpecialSweep} className="flex-1 py-3 px-4 rounded-xl font-arcade text-xs text-black bg-gradient-to-r from-cyber-green via-cyber-blue to-cyber-yellow shadow-[0_0_20px_rgba(0,255,102,0.4)]">
                        UNLEASH HADOKEN SWEEP ({batchEmails.length}x MULTI-KILL!)
                      </button>
                      <button onClick={() => setShowSpecialModal(false)} className="py-3 px-4 rounded-xl font-mono text-xs text-slate-400 bg-slate-900 border border-slate-800">
                        Cancel
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* STAGE CLEAR MODAL */}
              {showStageClear && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/90 backdrop-blur-lg">
                  <div className="relative w-full max-w-lg rounded-3xl bg-[#0c1222] border-2 border-cyber-green p-8 text-center text-white shadow-[0_0_40px_rgba(0,255,102,0.35)]">
                    <div className="text-5xl mb-3">🏆</div>
                    <div className="font-arcade text-xs text-cyber-green uppercase mb-1">STAGE CLEARED • LEVEL {currentLvl} PURGED!</div>
                    <h2 className="font-arcade text-xl sm:text-2xl text-white uppercase mb-4">{lvlConfig.name} PURGED!</h2>
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 bg-slate-950 p-4 rounded-2xl border border-slate-800 mb-6 font-mono text-xs">
                      <div>
                        <span className="text-slate-400 text-[10px]">SCORE</span>
                        <p className="font-arcade text-sm text-white mt-1">{player.score}</p>
                      </div>
                      <div>
                        <span className="text-slate-400 text-[10px]">RANK</span>
                        <p className="font-arcade text-sm text-cyber-yellow mt-1">RANK S</p>
                      </div>
                      <div>
                        <span className="text-slate-400 text-[10px]">COMBO</span>
                        <p className="font-arcade text-sm text-cyber-pink mt-1">{player.streak}x</p>
                      </div>
                      <div>
                        <span className="text-slate-400 text-[10px]">EXP</span>
                        <p className="font-arcade text-sm text-cyber-green mt-1">+1,250</p>
                      </div>
                    </div>
                    <div className="flex flex-col sm:flex-row gap-3">
                      {nextLvlConfig ? (
                        <button onClick={() => { setShowStageClear(false); setCurrentLvl(nextLvlConfig.id); setMonsterIdx(0); setRoundTimer(60); }} className="flex-1 py-3 px-4 rounded-xl font-arcade text-xs text-black bg-gradient-to-r from-cyber-green via-cyber-blue to-cyber-yellow shadow-[0_0_20px_rgba(0,255,102,0.4)]">
                          ENTER {nextLvlConfig.name} →
                        </button>
                      ) : null}
                      <button onClick={() => { setShowStageClear(false); setView('home'); }} className="py-3 px-5 rounded-xl font-mono text-xs text-slate-300 bg-slate-900 border border-slate-800">
                        Return to Hub
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* FULL EMAIL MODAL */}
              {showFullEmail && currMonster && (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md">
                  <div className="relative w-full max-w-2xl rounded-2xl bg-[#0c1222] border border-slate-700 p-6 text-white max-h-[80vh] flex flex-col">
                    <div className="flex justify-between items-center border-b border-slate-800 pb-3 mb-4">
                      <h3 className="font-semibold text-sm truncate pr-4 text-white">{currMonster.subject}</h3>
                      <button onClick={() => setShowFullEmail(false)} className="text-slate-400 hover:text-white">✕</button>
                    </div>
                    <div className="text-xs text-slate-400 font-mono mb-4">
                      From: {currMonster.sender} &lt;{currMonster.senderEmail}&gt; • Date: {currMonster.date}
                    </div>
                    <div className="overflow-y-auto flex-1 p-4 bg-slate-950 rounded-xl border border-slate-800 text-xs text-slate-300 font-mono whitespace-pre-wrap leading-relaxed">
                      {currMonster.fullBody}
                    </div>
                    <div className="mt-4 pt-3 border-t border-slate-800 flex justify-end">
                      <button onClick={() => setShowFullEmail(false)} className="px-4 py-2 rounded-lg bg-cyber-blue text-black font-arcade text-[10px]">
                        RETURN TO ARENA
                      </button>
                    </div>
                  </div>
                </div>
              )}

            </div>
          )}

          {/* CONNECT GMAIL MODAL */}
          {isGmailModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="relative w-full max-w-lg rounded-2xl bg-[#0c1222] border-2 border-cyber-pink p-6 text-white shadow-neon-pink">
                <button onClick={() => setIsGmailModalOpen(false)} className="absolute top-4 right-4 text-slate-400 hover:text-white">✕</button>
                <div className="flex items-center gap-4 mb-4">
                  <div className="w-12 h-12 rounded-xl bg-cyber-pink/20 border border-cyber-pink flex items-center justify-center text-cyber-pink text-2xl">✉️</div>
                  <div>
                    <span className="font-arcade text-[10px] text-cyber-pink uppercase">STAGE 5 ROADMAP</span>
                    <h3 className="font-arcade text-base sm:text-lg text-white mt-0.5">GMAIL OAUTH NETLINK</h3>
                  </div>
                </div>
                <div className="p-3.5 rounded-xl bg-slate-900 border border-slate-800 text-xs text-slate-300 mb-5 leading-relaxed">
                  <p className="font-semibold text-white uppercase text-[11px] mb-1">Google Workspace Sandbox Mode</p>
                  <p className="text-slate-400">
                    Live Gmail OAuth is scheduled for Stage 5. Playable Demo Mode features 25 realistic email monsters, 5 campaign levels, and procedural sound effects ready right now!
                  </p>
                </div>
                <div className="flex gap-3">
                  <button onClick={() => { sound.playCoin(); setIsGmailModalOpen(false); setView('arena'); }} className="flex-1 py-3 px-4 rounded-xl font-arcade text-xs text-black bg-gradient-to-r from-cyber-blue via-cyber-purple to-cyber-pink shadow-neon-blue">
                    ⚔️ ENTER DEMO BATTLE
                  </button>
                  <button onClick={() => setIsGmailModalOpen(false)} className="py-3 px-5 rounded-xl font-mono text-xs text-slate-400 bg-slate-900 border border-slate-800">
                    Dismiss
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
